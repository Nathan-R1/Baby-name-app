<!DOCTYPE html>
<html>
<head>
    <title>Baby Names</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        h1 {
            color: #333;
            margin-bottom: 50px;
        }
        #name-display {
            font-size: 72px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 60px;
            text-align: center;
            min-height: 100px;
        }
        .buttons {
            display: flex;
            gap: 40px;
        }
        button {
            font-size: 24px;
            padding: 20px 50px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        #no-btn {
            background-color: #e74c3c;
            color: white;
        }
        #yes-btn {
            background-color: #27ae60;
            color: white;
        }
        #remaining {
            position: fixed;
            bottom: 20px;
            color: #666;
            font-size: 14px;
        }
        #login-screen {
            text-align: center;
        }
        #login-screen input {
            font-size: 24px;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
        }
        #login-screen button {
            background-color: #3498db;
            color: white;
        }
        .hidden {
            display: none !important;
        }
        #match-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #match-text {
            font-size: 80px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 0 0 20px #e74c3c, 0 0 40px #e74c3c;
            animation: bounce 0.5s ease infinite alternate;
        }
        #match-with {
            font-size: 24px;
            color: white;
            margin-top: 20px;
        }
        @keyframes bounce {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-30px) scale(1.1); }
        }
    </style>
</head>
<body>
    <div id="login-screen">
        <h1>baby names</h1>
        <input type="text" id="username" placeholder="Enter your name">
        <br>
        <button onclick="login()">Start</button>
    </div>
    
    <div id="app-screen" class="hidden">
        <h1 id="user-header">baby names</h1>
        <div id="name-display">Loading...</div>
        <div class="buttons">
            <button id="no-btn">No</button>
            <button id="yes-btn">Yes</button>
        </div>
        <div id="remaining"></div>
    </div>
    
    <div id="match-overlay" class="hidden">
        <div id="match-text">MATCH!</div>
        <div id="match-with"></div>
    </div>

    <script>
        let username = '';
        
        async function login() {
            username = document.getElementById('username').value.trim();
            if (!username) {
                alert('Please enter your name');
                return;
            }
            
            const response = await fetch('/api/login/' + encodeURIComponent(username));
            const data = await response.json();
            
            document.getElementById('user-header').textContent = 'Baby names for: ' + username;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            
            displayName(data);
        }
        
        function displayName(data) {
            document.getElementById('name-display').textContent = data.name || 'No more names!';
            document.getElementById('remaining').textContent = data.remaining !== undefined ? `${data.remaining} names remaining` : '';
        }
        
        async function handleNo() {
            const response = await fetch('/api/dislike', { 
                method: 'POST',
                headers: { 'X-Username': username }
            });
            const data = await response.json();
            displayName(data);
        }
        
        async function handleYes() {
            const response = await fetch('/api/like', { 
                method: 'POST',
                headers: { 'X-Username': username }
            });
            const data = await response.json();
            displayName(data);
            
            if (data.match) {
                document.getElementById('match-with').textContent = 'Matched with: ' + data.match;
                document.getElementById('match-overlay').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('match-overlay').classList.add('hidden');
                }, 3000);
            }
        }
        
        document.getElementById('no-btn').addEventListener('click', handleNo);
        document.getElementById('yes-btn').addEventListener('click', handleYes);
    </script>
</body>
</html>
